# ─── Production Docker Compose ────────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Prerequisites:
#   1. Create backend/.env.prod (copy from backend/.env.example and fill all values)
#   2. NODE_ENV must be "production" in .env.prod
#   3. MONGODB_URI must point to a real Atlas cluster or external Mongo instance
#      (the mongo service here is for self-hosted deployments; comment it out if
#      you use MongoDB Atlas)

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend          # build context = backend/ directory
      dockerfile: Dockerfile      # multi-stage Dockerfile
    image: moviehub-backend:latest
    container_name: moviehub-backend-prod
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env.prod       # create this file from .env.example
    environment:
      NODE_ENV: production
      # Override service hostnames to match Docker network aliases below
      MONGODB_URI: mongodb://mongo:27017/moviehub_prod
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - moviehub-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  # Remove this service if you use MongoDB Atlas (cloud)
  mongo:
    image: mongo:7
    container_name: moviehub-mongo-prod
    restart: unless-stopped
    ports:
      - "27017:27017"             # remove in production to avoid exposing DB port
    volumes:
      - mongo_prod_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro  # optional init scripts
    environment:
      MONGO_INITDB_DATABASE: moviehub_prod
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - moviehub-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: moviehub-redis-prod
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"               # remove in production to avoid exposing Redis port
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - moviehub-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Elasticsearch ─────────────────────────────────────────────────────────────
  # Optional: remove if using Elastic Cloud
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: moviehub-elasticsearch-prod
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false        # enable + configure for real production
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_prod_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - moviehub-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: moviehub-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro        # mount SSL certs here
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - moviehub-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ─── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  mongo_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  elasticsearch_prod_data:
    driver: local

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  moviehub-net:
    driver: bridge
