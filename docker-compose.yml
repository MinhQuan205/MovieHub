services:
  backend:
    image: node:20-alpine
    container_name: moviehub-backend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 4000
      # Fix: trỏ sang MongoDB Atlas thay vì container local
      MONGODB_URI: "mongodb+srv://moviehub_user:2UTjHLqsd0Opc94w@moviehub-cluster.zogf4z1.mongodb.net/moviehub?retryWrites=true&w=majority&appName=moviehub-cluster&authSource=admin"
      REDIS_URL: redis://redis:6379
      API_PREFIX: /api/v1
      CORS_ORIGIN: http://localhost:8081,http://localhost:19006
      HEALTH_STRICT_READINESS: "false"
      DATABASE_CONNECT_RETRIES: "5"
      DATABASE_CONNECT_RETRY_DELAY_MS: "2000"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      RATE_LIMIT_MAX_REQUESTS: "100"
      AUTH_RATE_LIMIT_WINDOW_SECONDS: "60"
      AUTH_RATE_LIMIT_MAX_REQUESTS: "10"
      JWT_ACCESS_SECRET: moviehub_access_secret_dev_123456
      JWT_REFRESH_SECRET: moviehub_refresh_secret_dev_123456
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      TMDB_API_KEY: ""
      TMDB_BASE_URL: https://api.themoviedb.org/3
      TMDB_IMAGE_BASE: https://image.tmdb.org/t/p
      # Fix: ELASTICSEARCH_URL phải trỏ tới tên service "elasticsearch", không phải localhost
      ELASTICSEARCH_URL: http://elasticsearch:9200
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_CALLBACK_URL: ""
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: moviehub-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: moviehub-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  redis_data:
  elasticsearch_data:
