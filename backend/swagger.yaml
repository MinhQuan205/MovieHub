openapi: 3.0.3
info:
  title: MovieHub API
  version: 1.0.0
  description: Auth and Core features contract between Backend and Mobile.
servers:
  - url: /api/v1

tags:
  - name: Auth
    description: Authentication and account lifecycle
  - name: Movies
    description: TMDB movie queries
  - name: Persons
    description: TMDB person/actor queries
  - name: Search
    description: Elasticsearch queries
  - name: Watchlist
    description: User personal watchlists
  - name: Reviews
    description: Movie reviews and ratings
  - name: Users
    description: User profile and avatar
  - name: Notifications
    description: User notifications and FCM
 
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token in Authorization header as Bearer token.
    refreshCookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: HttpOnly refresh token cookie set by login/register/refresh.
  schemas:
    UserPreferences:
      type: object
      properties:
        language:
          type: string
          enum: [vi, en]
        theme:
          type: string
          enum: [light, dark, system]
        favoriteGenres:
          type: array
          items:
            type: integer
      required: [language, theme, favoriteGenres]
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        avatar:
          type: string
        role:
          type: string
          enum: [user, admin]
        isEmailVerified:
          type: boolean
        preferences:
          $ref: '#/components/schemas/UserPreferences'
      required: [id, email, displayName, role, isEmailVerified, preferences]
    PaginatedResponse:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        message:
          type: string
        meta:
          $ref: '#/components/schemas/PaginatedResponse'
      required: [success, data, message]
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [success, error]

    # New Schemas
    Movie:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        overview:
          type: string
        posterPath:
          type: string
        backdropPath:
          type: string
        voteAverage:
          type: number
        releaseDate:
          type: string
        genreIds:
          type: array
          items:
            type: integer
    MovieDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        overview:
          type: string
        posterPath:
          type: string
        backdropPath:
          type: string
        voteAverage:
          type: number
        releaseDate:
          type: string
        runtime:
          type: integer
        genres:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        credits:
          type: object
        videos:
          type: object
    Person:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        biography:
          type: string
        profilePath:
          type: string
        knownForDepartment:
          type: string
    WatchlistMovie:
      type: object
      properties:
        tmdbId:
          type: integer
        tmdbTitle:
          type: string
        posterPath:
          type: string
        addedAt:
          type: string
          format: date-time
        note:
          type: string
    WatchlistItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isPublic:
          type: boolean
        shareSlug:
          type: string
        movies:
          type: array
          items:
            $ref: '#/components/schemas/WatchlistMovie'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Review:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        tmdbMovieId:
          type: integer
        tmdbTitle:
          type: string
        rating:
          type: number
        content:
          type: string
        containsSpoiler:
          type: boolean
        likesCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

paths:
  # ---------------- AUTH ----------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Register account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                displayName:
                  type: string
              required: [email, password, displayName]
      responses:
        '201':
          description: Register success
          headers:
            Set-Cookie:
              description: Sets HttpOnly refreshToken cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/AuthUser'
                          accessToken:
                            type: string
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Login success
          headers:
            Set-Cookie:
              description: Sets HttpOnly refreshToken cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/AuthUser'
                          accessToken:
                            type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/AuthUser'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke current access token + refresh session
      security:
        - bearerAuth: []
        - refreshCookieAuth: []
      responses:
        '200':
          description: Logout success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue new access token
      security:
        - refreshCookieAuth: []
      responses:
        '200':
          description: Token refresh success
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /auth/verify-email/{token}:
    get:
      tags: [Auth]
      summary: Verify email with one-time token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request reset password link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        '200':
          description: Generic success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /auth/reset-password/{token}:
    post:
      tags: [Auth]
      summary: Reset password with one-time token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 8
              required: [password]
      responses:
        '200':
          description: Password reset success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  # ---------------- MOVIES ----------------
  /movies/trending:
    get:
      tags: [Movies]
      summary: Get trending movies
      parameters:
        - in: query
          name: window
          schema:
            type: string
            enum: [day, week]
            default: day
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: List of movies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          results:
                            type: array
                            items:
                              $ref: '#/components/schemas/Movie'

  /movies/now-playing:
    get:
      tags: [Movies]
      summary: Get now playing movies
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /movies/popular:
    get:
      tags: [Movies]
      summary: Get popular movies
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /movies/top-rated:
    get:
      tags: [Movies]
      summary: Get top rated movies
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /movies/upcoming:
    get:
      tags: [Movies]
      summary: Get upcoming movies
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /movies/{id}:
    get:
      tags: [Movies]
      summary: Get movie details with credits/videos
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MovieDetail'

  /movies/{id}/similar:
    get:
      tags: [Movies]
      summary: Get similar movies
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /genres:
    get:
      tags: [Movies]
      summary: Get movie genres list
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /discover:
    get:
      tags: [Movies]
      summary: Discover and filter movies
      parameters:
        - in: query
          name: genre
          schema:
            type: string
        - in: query
          name: year
          schema:
            type: integer
        - in: query
          name: rating
          schema:
            type: number
        - in: query
          name: sort
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  # ---------------- PERSONS ----------------
  /persons/{id}:
    get:
      tags: [Persons]
      summary: Get person details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Person'

  /persons/{id}/credits:
    get:
      tags: [Persons]
      summary: Get person credits
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  # ---------------- SEARCH ----------------
  /search:
    get:
      tags: [Search]
      summary: Search movies with Elasticsearch
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /search/suggestions:
    get:
      tags: [Search]
      summary: Autocomplete search suggestions (Top 5)
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  # ---------------- WATCHLIST ----------------
  /watchlists:
    get:
      tags: [Watchlist]
      summary: Get all watchlists of the user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WatchlistItem'
    post:
      tags: [Watchlist]
      summary: Create a new watchlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                isPublic:
                  type: boolean
              required: [name]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /watchlists/{id}:
    put:
      tags: [Watchlist]
      summary: Update watchlist settings
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                isPublic:
                  type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
    delete:
      tags: [Watchlist]
      summary: Delete a watchlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /watchlists/{id}/movies:
    post:
      tags: [Watchlist]
      summary: Add movie to watchlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tmdbId:
                  type: integer
              required: [tmdbId]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /watchlists/{id}/movies/{tmdbId}:
    delete:
      tags: [Watchlist]
      summary: Remove movie from watchlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: tmdbId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  # ---------------- REVIEWS ----------------
  /movies/{id}/reviews:
    get:
      tags: [Reviews]
      summary: Get movie reviews
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Review'
    post:
      tags: [Reviews]
      summary: Create a review
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: number
                content:
                  type: string
                containsSpoiler:
                  type: boolean
              required: [rating, content]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /reviews/{id}:
    put:
      tags: [Reviews]
      summary: Update a review
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: number
                content:
                  type: string
                containsSpoiler:
                  type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
    delete:
      tags: [Reviews]
      summary: Delete a review
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /reviews/{id}/like:
    post:
      tags: [Reviews]
      summary: Toggle like on a review
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /reviews/{id}/report:
    post:
      tags: [Reviews]
      summary: Report a review
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required: [reason]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  # ---------------- USERS ----------------
  /users/profile:
    get:
      tags: [Users]
      summary: Get user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
    put:
      tags: [Users]
      summary: Update user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                preferences:
                  $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /users/avatar:
    post:
      tags: [Users]
      summary: Upload user avatar to S3
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
              required: [avatar]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  # ---------------- NOTIFICATIONS ----------------
  /notifications:
    get:
      tags: [Notifications]
      summary: Get paginated notifications
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'

  /notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark all unread notifications as read
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /notifications/fcm-token:
    post:
      tags: [Notifications]
      summary: Register FCM device token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required: [token]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
    delete:
      tags: [Notifications]
      summary: Remove FCM device token
      security:
        - bearerAuth: []
