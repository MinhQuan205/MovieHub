openapi: 3.0.3
info:
  title: MovieHub API
  version: 1.0.0
  description: Auth contract between Backend and Mobile.
servers:
  - url: /api/v1

tags:
  - name: Auth
    description: Authentication and account lifecycle

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token in Authorization header as Bearer token.
    refreshCookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: HttpOnly refresh token cookie set by login/register/refresh.
  schemas:
    UserPreferences:
      type: object
      properties:
        language:
          type: string
          enum: [vi, en]
        theme:
          type: string
          enum: [light, dark, system]
        favoriteGenres:
          type: array
          items:
            type: integer
      required: [language, theme, favoriteGenres]
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [user, admin]
        isEmailVerified:
          type: boolean
        preferences:
          $ref: '#/components/schemas/UserPreferences'
      required: [id, email, displayName, role, isEmailVerified, preferences]
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        message:
          type: string
      required: [success, data, message]
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [success, error]

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                displayName:
                  type: string
              required: [email, password, displayName]
      responses:
        '201':
          description: Register success
          headers:
            Set-Cookie:
              description: Sets HttpOnly refreshToken cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/AuthUser'
                          accessToken:
                            type: string
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Login success
          headers:
            Set-Cookie:
              description: Sets HttpOnly refreshToken cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/AuthUser'
                          accessToken:
                            type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/AuthUser'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke current access token + refresh session
      description: Requires Bearer access token and will also clear refreshToken cookie.
      security:
        - bearerAuth: []
        - refreshCookieAuth: []
      responses:
        '200':
          description: Logout success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue new access token
      security:
        - refreshCookieAuth: []
      responses:
        '200':
          description: Token refresh success
          headers:
            Set-Cookie:
              description: Sets rotated HttpOnly refreshToken cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          description: Invalid or missing refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/verify-email/{token}:
    get:
      tags: [Auth]
      summary: Verify email with one-time token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request reset password link
      description: Always returns generic success message to avoid email enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        '200':
          description: Generic success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /auth/reset-password/{token}:
    post:
      tags: [Auth]
      summary: Reset password with one-time token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 8
              required: [password]
      responses:
        '200':
          description: Password reset success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
